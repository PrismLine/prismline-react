<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="500" height="360" fill="none">
  <defs>
    <linearGradient id="prismGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="40%" stop-color="#D50000"/>
      <stop offset="100%" stop-color="#6A000A"/>
    </linearGradient>
    <linearGradient id="prismGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6D00"/>
      <stop offset="50%" stop-color="#E51829"/>
      <stop offset="100%" stop-color="#7B020B"/>
    </linearGradient>
    <linearGradient id="prismCenter" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FF3D00"/>
      <stop offset="100%" stop-color="#800000"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Center Top Prism Facet -->
  <polygon points="215,115 285,115 250,150" fill="url(#prismCenter)" filter="url(#glow)" />

  <!-- Main Left Wing Blade -->
  <path d="M 70,45 C 135,65 195,120 250,230 C 210,155 160,115 105,95 C 90,85 78,65 70,45 Z" fill="url(#prismGrad1)" />

  <!-- Main Right Wing Blade -->
  <path d="M 430,45 C 365,65 305,120 250,230 C 290,155 340,115 395,95 C 410,85 422,65 430,45 Z" fill="url(#prismGrad2)" />

  <!-- Center Lower V-Chevron / Shield Tip -->
  <path d="M 125,125 C 175,155 220,195 250,250 C 280,195 325,155 375,125 C 315,185 270,235 250,285 C 230,235 185,185 125,125 Z" fill="url(#prismGrad1)" />

  <!-- Lower Left Wing Accent Winglet -->
  <path d="M 115,135 C 135,160 160,185 190,205 C 155,185 130,165 115,135 Z" fill="url(#prismGrad1)" />

  <!-- Lower Right Wing Accent Winglet -->
  <path d="M 385,135 C 365,160 340,185 310,205 C 345,185 370,165 385,135 Z" fill="url(#prismGrad2)" />
</svg>
